<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイミングチャート</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Meiryo, sans-serif;
      font-size: 13px;
      background: #f0f2f5;
      color: #222;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── ツールバー ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #1e2a3a;
      color: #fff;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    #toolbar h1 {
      font-size: 14px;
      font-weight: 600;
      margin-right: 8px;
      white-space: nowrap;
    }

    .tb-sep {
      width: 1px;
      height: 22px;
      background: #445;
      margin: 0 4px;
    }

    .tb-btn {
      padding: 4px 12px;
      border: 1px solid #556;
      border-radius: 4px;
      background: #2e3f55;
      color: #dde;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .tb-btn:hover { background: #3a5070; }
    .tb-btn.primary { background: #2563eb; border-color: #3b82f6; color: #fff; }
    .tb-btn.primary:hover { background: #1d4ed8; }
    .tb-btn.danger  { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }
    .tb-btn.danger:hover  { background: #991b1b; }

    .tb-label { font-size: 11px; color: #99a; white-space: nowrap; }

    /* ── メインエリア ── */
    #main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ── 左パネル ── */
    #sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #dde;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 8px 10px;
      font-weight: 600;
      font-size: 12px;
      color: #556;
      border-bottom: 1px solid #eee;
      background: #f7f8fa;
    }

    #signal-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .signal-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-bottom: 1px solid #f0f0f0;
      cursor: default;
      transition: background 0.1s;
    }
    .signal-item:hover { background: #f5f8ff; }
    .signal-item.selected { background: #dbeafe; }

    .signal-item .drag-handle {
      color: #bbb;
      cursor: grab;
      font-size: 14px;
      flex-shrink: 0;
      user-select: none;
    }

    .signal-item .sig-name {
      flex: 1;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .signal-item .sig-name:hover { text-decoration: underline; }

    .signal-item .sig-type-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      background: #e0e7ff;
      color: #4338ca;
      flex-shrink: 0;
    }
    .signal-item .sig-type-badge.multi {
      background: #fef3c7;
      color: #92400e;
    }

    .signal-item .del-btn {
      color: #ccc;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
      line-height: 1;
    }
    .signal-item .del-btn:hover { color: #ef4444; }

    #sidebar-footer {
      padding: 8px 10px;
      border-top: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #sidebar-footer button {
      width: 100%;
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #ccd;
      background: #f7f8fa;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.1s;
    }
    #sidebar-footer button:hover { background: #e8eaf0; }

    /* ── キャンバスエリア ── */
    #canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #f0f2f5;
      overflow: hidden;
    }

    #canvas-scroll {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    #chart-canvas {
      display: block;
      cursor: crosshair;
      background: #fff;
    }

    /* ── ステータスバー ── */
    #statusbar {
      padding: 3px 12px;
      font-size: 11px;
      color: #778;
      background: #e8eaf0;
      border-top: 1px solid #d0d4dc;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── モーダル ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 8px;
      padding: 20px 24px;
      min-width: 300px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .modal h2 { font-size: 15px; margin-bottom: 14px; color: #1e2a3a; }
    .modal label { display: block; font-size: 12px; color: #556; margin-bottom: 3px; margin-top: 10px; }
    .modal input, .modal select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccd;
      border-radius: 4px;
      font-size: 13px;
    }
    .modal input:focus, .modal select:focus { outline: 2px solid #3b82f6; border-color: transparent; }
    .modal .modal-levels { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .modal .level-row { display: flex; gap: 6px; align-items: center; }
    .modal .level-row input { flex: 1; }
    .modal .level-row button { padding: 3px 8px; border: 1px solid #ccd; border-radius: 3px; background: #f5f5f5; cursor: pointer; font-size: 11px; }
    .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .modal .modal-actions button { padding: 6px 18px; border-radius: 4px; border: 1px solid #ccd; cursor: pointer; font-size: 13px; }
    .modal .modal-actions .ok { background: #2563eb; color: #fff; border-color: #2563eb; }
    .modal .modal-actions .ok:hover { background: #1d4ed8; }
    .modal .modal-actions .cancel { background: #fff; }
    .modal .modal-actions .cancel:hover { background: #f5f5f5; }
  </style>
</head>
<body>

<!-- ツールバー -->
<div id="toolbar">
  <h1>⏱ タイミングチャート</h1>
  <div class="tb-sep"></div>
  <span class="tb-label">ツール:</span>
  <button class="tb-btn primary" id="btn-tool-select"  title="選択・移動">選択</button>
  <button class="tb-btn"         id="btn-tool-edge"    title="遷移点を追加">遷移追加</button>
  <button class="tb-btn"         id="btn-tool-annot"   title="時間アノテーション">矢印注釈</button>
  <div class="tb-sep"></div>
  <span class="tb-label">表示:</span>
  <button class="tb-btn" id="btn-zoom-in">＋</button>
  <button class="tb-btn" id="btn-zoom-out">－</button>
  <button class="tb-btn" id="btn-grid-toggle">グリッド</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-undo">元に戻す</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-export-png">PNG保存</button>
  <button class="tb-btn" id="btn-export-svg">SVG保存</button>
  <button class="tb-btn" id="btn-save-json">JSON保存</button>
  <button class="tb-btn" id="btn-load-json">JSON読込</button>
  <input type="file" id="file-input" accept=".json" style="display:none">
</div>

<!-- メイン -->
<div id="main">

  <!-- 左パネル -->
  <div id="sidebar">
    <div id="sidebar-header">信号一覧</div>
    <div id="signal-list"><!-- JS で生成 --></div>
    <div id="sidebar-footer">
      <button id="btn-add-binary">＋ バイナリ信号を追加</button>
      <button id="btn-add-multi">＋ 多値信号を追加</button>
    </div>
  </div>

  <!-- キャンバスエリア -->
  <div id="canvas-area">
    <div id="canvas-scroll">
      <canvas id="chart-canvas"></canvas>
    </div>
    <div id="statusbar">準備完了 | クリック: 遷移点を追加 | 右クリック: 削除</div>
  </div>

</div>

<!-- 信号追加/編集モーダル -->
<div class="modal-overlay" id="modal-signal">
  <div class="modal">
    <h2 id="modal-signal-title">信号を追加</h2>
    <label>信号名</label>
    <input type="text" id="modal-sig-name" placeholder="例: 信号A">
    <div id="modal-binary-opts">
      <label>ONラベル</label>
      <input type="text" id="modal-on-label" value="ON">
      <label>OFFラベル</label>
      <input type="text" id="modal-off-label" value="OFF">
    </div>
    <div id="modal-multi-opts" style="display:none">
      <label>レベル名（上から順に）</label>
      <div class="modal-levels" id="modal-levels-container"></div>
      <button id="btn-add-level" style="margin-top:6px;padding:3px 10px;border:1px solid #ccd;border-radius:3px;background:#f5f5f5;cursor:pointer;font-size:12px;">＋ レベルを追加</button>
    </div>
    <div class="modal-actions">
      <button class="cancel" id="modal-signal-cancel">キャンセル</button>
      <button class="ok"     id="modal-signal-ok">OK</button>
    </div>
  </div>
</div>

<!-- アノテーション編集モーダル -->
<div class="modal-overlay" id="modal-annot">
  <div class="modal">
    <h2>矢印注釈の編集</h2>
    <label>ラベル（例: 3s, 100ms）</label>
    <input type="text" id="modal-annot-label" placeholder="3s">
    <div class="modal-actions">
      <button class="cancel" id="modal-annot-cancel">キャンセル</button>
      <button class="ok danger" id="modal-annot-delete" style="background:#fee2e2;color:#991b1b;border-color:#fca5a5;">削除</button>
      <button class="ok"    id="modal-annot-ok">OK</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
//  Step 1: 骨格のみ – コンソールで動作確認用
// ─────────────────────────────────────────────
console.log('タイミングチャート Step 1: 構造OK');

// ── 定数 ──
const LABEL_WIDTH  = 110; // 左の信号ラベル幅 (px)
const ROW_HEIGHT   = 80;  // 1信号行の高さ (px)
const ROW_PAD      = 16;  // 上下余白
const WAVE_H       = ROW_HEIGHT - ROW_PAD * 2; // 波形の振幅高さ
const HEADER_H     = 24;  // 時間軸ヘッダ高さ
const ANNOT_AREA_H = 50;  // アノテーション行の高さ

// ── アプリ状態 ──
const state = {
  signals: [],      // Signal[]
  events:  [],      // Event[]
  annots:  [],      // Annotation[]
  tool: 'select',   // 'select' | 'edge' | 'annot'
  scale: 80,        // px per second
  totalTime: 10,    // 表示する合計秒数
  showGrid: true,
  history: [],      // Undo 用スナップショット
  annotStep: null,  // アノテーション追加中の第1点
  selectedAnnot: null,
};

// ── DOM 参照 ──
const canvas   = document.getElementById('chart-canvas');
const ctx      = canvas.getContext('2d');
const statusEl = document.getElementById('statusbar');

function setStatus(msg) { statusEl.textContent = msg; }

// キャンバスサイズを計算してセット（後の Step で描画処理を追加）
function resizeCanvas() {
  const annotRows = state.annots.length > 0 ? 1 : 0;
  const h = HEADER_H + state.signals.length * ROW_HEIGHT + annotRows * ANNOT_AREA_H + 40;
  const w = Math.max(
    document.getElementById('canvas-scroll').clientWidth,
    LABEL_WIDTH + state.totalTime * state.scale + 60
  );
  canvas.width  = w;
  canvas.height = h;
}

resizeCanvas();

// ════════════════════════════════════════════════
//  Step 2: データモデル – Signal / Event / Annotation
// ════════════════════════════════════════════════

let _nextId = 1;
function uid() { return _nextId++; }

// ── Signal ──
// {
//   id: number,
//   name: string,
//   type: 'binary' | 'multi',
//   levels: string[],   // binary: ['ON','OFF']  multi: ['10b','01b','00b'] (上→下順)
//   color: string,      // 波形の色
// }

// ── Event ──
// {
//   id: number,
//   signalId: number,
//   time: number,       // 秒 (float)
//   value: number,      // levels[] のインデックス (0 = 最上位レベル)
// }
// ※ time 昇順にソートして使う。time=0 より前に初期値として value=末尾レベルを仮定。

// ── Annotation ──
// {
//   id: number,
//   t1: number,   // 開始時刻 (秒)
//   t2: number,   // 終了時刻 (秒)
//   label: string,
// }

const COLORS = [
  '#2563eb','#16a34a','#dc2626','#9333ea',
  '#0891b2','#d97706','#db2777','#65a30d',
];
let _colorIdx = 0;
function nextColor() { return COLORS[(_colorIdx++) % COLORS.length]; }

// ── Signal CRUD ──
function createSignal(name, type, levels) {
  return { id: uid(), name, type, levels: [...levels], color: nextColor() };
}

function addSignal(sig) {
  saveHistory();
  state.signals.push(sig);
  // 初期値: 各信号の最下位レベル(末尾インデックス)を time=0 に設定
  state.events.push({ id: uid(), signalId: sig.id, time: 0, value: sig.levels.length - 1 });
}

function removeSignal(sigId) {
  saveHistory();
  state.signals = state.signals.filter(s => s.id !== sigId);
  state.events  = state.events.filter(e => e.signalId !== sigId);
}

function updateSignalName(sigId, newName) {
  saveHistory();
  const s = state.signals.find(s => s.id === sigId);
  if (s) s.name = newName;
}

// ── Event CRUD ──
function addEvent(signalId, time, value) {
  saveHistory();
  // 同じ時刻に既存イベントがあれば上書き
  const existing = state.events.find(e => e.signalId === signalId && Math.abs(e.time - time) < 0.001);
  if (existing) { existing.value = value; return; }
  state.events.push({ id: uid(), signalId, time, value });
}

function removeEvent(eventId) {
  // time=0 のイベント（初期値）は削除しない
  const ev = state.events.find(e => e.id === eventId);
  if (!ev || ev.time === 0) return;
  saveHistory();
  state.events = state.events.filter(e => e.id !== eventId);
}

// 信号の time=t における現在値インデックスを返す
function getValueAt(signalId, t) {
  const evs = state.events
    .filter(e => e.signalId === signalId && e.time <= t)
    .sort((a, b) => b.time - a.time);
  if (evs.length === 0) {
    const sig = state.signals.find(s => s.id === signalId);
    return sig ? sig.levels.length - 1 : 0;
  }
  return evs[0].value;
}

// 信号のイベントを時刻順に返す（time=0 の初期値含む）
function getSortedEvents(signalId) {
  return state.events
    .filter(e => e.signalId === signalId)
    .sort((a, b) => a.time - b.time);
}

// ── Annotation CRUD ──
function addAnnot(t1, t2, label) {
  saveHistory();
  if (t1 > t2) [t1, t2] = [t2, t1];
  state.annots.push({ id: uid(), t1, t2, label });
}

function removeAnnot(annotId) {
  saveHistory();
  state.annots = state.annots.filter(a => a.id !== annotId);
}

function updateAnnot(annotId, label) {
  saveHistory();
  const a = state.annots.find(a => a.id === annotId);
  if (a) a.label = label;
}

// ── Undo ──
const MAX_HISTORY = 30;

function saveHistory() {
  state.history.push(JSON.stringify({ signals: state.signals, events: state.events, annots: state.annots }));
  if (state.history.length > MAX_HISTORY) state.history.shift();
}

function undo() {
  if (state.history.length === 0) { setStatus('これ以上元に戻せません'); return; }
  const snap = JSON.parse(state.history.pop());
  state.signals = snap.signals;
  state.events  = snap.events;
  state.annots  = snap.annots;
  // id カウンタをリセットしないよう最大値を維持
  refreshAll();
}

// ── サンプルデータ投入（動作確認用）──
function loadSampleData() {
  const sigA = createSignal('信号A', 'binary', ['ON', 'OFF']);
  const sigB = createSignal('信号B', 'binary', ['ON', 'OFF']);
  const sigOut = createSignal('出力', 'multi', ['10b', '01b', '00b']);

  addSignal(sigA);
  addSignal(sigB);
  addSignal(sigOut);

  // 信号A: t=2 で OFF→ON
  addEvent(sigA.id, 2, 0);  // ON (index 0)

  // 信号B: t=3.5 で OFF→ON
  addEvent(sigB.id, 3.5, 0); // ON (index 0)

  // 出力: 00b→01b (t=2), 01b→10b (t=3.5), 10b→00b (t=6.5)
  addEvent(sigOut.id, 2,   1); // 01b
  addEvent(sigOut.id, 3.5, 0); // 10b
  addEvent(sigOut.id, 6.5, 2); // 00b

  // アノテーション: 3.5s ～ 6.5s = "3s"
  addAnnot(3.5, 6.5, '3s');
}

// ── refreshAll: 描画＋サイドバー更新（後の Step で本実装）──
function refreshAll() {
  renderSidebar();
  resizeCanvas();
  // drawChart() は Step 3 以降で追加
}

// ── サイドバー仮描画 ──
function renderSidebar() {
  const list = document.getElementById('signal-list');
  list.innerHTML = '';
  state.signals.forEach((sig, idx) => {
    const item = document.createElement('div');
    item.className = 'signal-item';
    item.dataset.id = sig.id;
    item.innerHTML = `
      <span class="drag-handle" title="ドラッグで並び替え">⠿</span>
      <span class="sig-name" title="クリックで名前を編集">${sig.name}</span>
      <span class="sig-type-badge ${sig.type === 'multi' ? 'multi' : ''}">${sig.type === 'binary' ? '2値' : '多値'}</span>
      <span class="del-btn" title="削除">×</span>
    `;
    item.querySelector('.sig-name').addEventListener('click', () => openEditSignalModal(sig.id));
    item.querySelector('.del-btn').addEventListener('click', () => { removeSignal(sig.id); refreshAll(); });
    list.appendChild(item);
  });
}

// ── モーダル制御（信号追加）──
let _modalMode = 'add-binary'; // 'add-binary' | 'add-multi' | 'edit'
let _editSigId = null;

function openAddSignalModal(type) {
  _modalMode = type === 'binary' ? 'add-binary' : 'add-multi';
  _editSigId = null;
  document.getElementById('modal-signal-title').textContent = type === 'binary' ? 'バイナリ信号を追加' : '多値信号を追加';
  document.getElementById('modal-sig-name').value = '';
  document.getElementById('modal-on-label').value  = 'ON';
  document.getElementById('modal-off-label').value = 'OFF';
  document.getElementById('modal-binary-opts').style.display = type === 'binary' ? '' : 'none';
  document.getElementById('modal-multi-opts').style.display  = type === 'multi'  ? '' : 'none';
  if (type === 'multi') buildLevelRows(['10b', '01b', '00b']);
  document.getElementById('modal-signal').classList.add('open');
  document.getElementById('modal-sig-name').focus();
}

function openEditSignalModal(sigId) {
  const sig = state.signals.find(s => s.id === sigId);
  if (!sig) return;
  _modalMode = 'edit';
  _editSigId = sigId;
  document.getElementById('modal-signal-title').textContent = '信号を編集';
  document.getElementById('modal-sig-name').value = sig.name;
  document.getElementById('modal-binary-opts').style.display = sig.type === 'binary' ? '' : 'none';
  document.getElementById('modal-multi-opts').style.display  = sig.type === 'multi'  ? '' : 'none';
  if (sig.type === 'binary') {
    document.getElementById('modal-on-label').value  = sig.levels[0];
    document.getElementById('modal-off-label').value = sig.levels[1];
  } else {
    buildLevelRows(sig.levels);
  }
  document.getElementById('modal-signal').classList.add('open');
  document.getElementById('modal-sig-name').focus();
}

function buildLevelRows(levels) {
  const container = document.getElementById('modal-levels-container');
  container.innerHTML = '';
  levels.forEach(lv => addLevelRow(lv));
}

function addLevelRow(value = '') {
  const container = document.getElementById('modal-levels-container');
  const row = document.createElement('div');
  row.className = 'level-row';
  row.innerHTML = `<input type="text" value="${value}" placeholder="レベル名"><button class="rm-lv">－</button>`;
  row.querySelector('.rm-lv').addEventListener('click', () => row.remove());
  container.appendChild(row);
}

document.getElementById('btn-add-level').addEventListener('click', () => addLevelRow());
document.getElementById('modal-signal-cancel').addEventListener('click', () => {
  document.getElementById('modal-signal').classList.remove('open');
});
document.getElementById('modal-signal-ok').addEventListener('click', () => {
  const name = document.getElementById('modal-sig-name').value.trim() || '信号';
  if (_modalMode === 'edit' && _editSigId !== null) {
    const sig = state.signals.find(s => s.id === _editSigId);
    if (sig) { saveHistory(); sig.name = name; }
  } else if (_modalMode === 'add-binary') {
    const on  = document.getElementById('modal-on-label').value.trim()  || 'ON';
    const off = document.getElementById('modal-off-label').value.trim() || 'OFF';
    addSignal(createSignal(name, 'binary', [on, off]));
  } else {
    const rows   = document.querySelectorAll('#modal-levels-container .level-row input');
    const levels = [...rows].map(r => r.value.trim() || '?');
    if (levels.length < 2) { alert('レベルは2つ以上必要です'); return; }
    addSignal(createSignal(name, 'multi', levels));
  }
  document.getElementById('modal-signal').classList.remove('open');
  refreshAll();
});

document.getElementById('btn-add-binary').addEventListener('click', () => openAddSignalModal('binary'));
document.getElementById('btn-add-multi').addEventListener('click',  () => openAddSignalModal('multi'));

// Undo ボタン
document.getElementById('btn-undo').addEventListener('click', undo);

// ── 起動 ──
loadSampleData();
refreshAll();
setStatus('Step 2 完了: データモデル・CRUD・Undo実装済み | 信号数: ' + state.signals.length);
</script>
