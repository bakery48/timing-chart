<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイミングチャート</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Meiryo, sans-serif;
      font-size: 13px;
      background: #f0f2f5;
      color: #222;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── ツールバー ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #1e2a3a;
      color: #fff;
      flex-shrink: 0;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      scrollbar-color: #445 #1e2a3a;
      min-height: 36px;
    }

    #toolbar h1 {
      font-size: 14px;
      font-weight: 600;
      margin-right: 8px;
      white-space: nowrap;
    }

    .tb-sep {
      width: 1px;
      height: 22px;
      background: #445;
      margin: 0 4px;
    }

    .tb-btn {
      padding: 4px 12px;
      border: 1px solid #556;
      border-radius: 4px;
      background: #2e3f55;
      color: #dde;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .tb-btn:hover { background: #3a5070; }
    .tb-btn.primary { background: #2563eb; border-color: #3b82f6; color: #fff; }
    .tb-btn.primary:hover { background: #1d4ed8; }
    .tb-btn.danger  { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }
    .tb-btn.danger:hover  { background: #991b1b; }

    .tb-label { font-size: 11px; color: #99a; white-space: nowrap; }

    /* ── メインエリア ── */
    #main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ── 左パネル ── */
    #sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #dde;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 8px 10px;
      font-weight: 600;
      font-size: 12px;
      color: #556;
      border-bottom: 1px solid #eee;
      background: #f7f8fa;
    }

    #signal-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .signal-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-bottom: 1px solid #f0f0f0;
      cursor: default;
      transition: background 0.1s;
    }
    .signal-item:hover { background: #f5f8ff; }
    .signal-item.selected { background: #dbeafe; }

    .signal-item .drag-handle {
      color: #bbb;
      cursor: grab;
      font-size: 14px;
      flex-shrink: 0;
      user-select: none;
    }

    .signal-item .sig-name {
      flex: 1;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .signal-item .sig-name:hover { text-decoration: underline; }

    .signal-item .sig-type-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      background: #e0e7ff;
      color: #4338ca;
      flex-shrink: 0;
    }
    .signal-item .sig-type-badge.multi {
      background: #fef3c7;
      color: #92400e;
    }

    .signal-item .del-btn {
      color: #ccc;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
      line-height: 1;
    }
    .signal-item .del-btn:hover { color: #ef4444; }

    #sidebar-footer {
      padding: 8px 10px;
      border-top: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #sidebar-footer button {
      width: 100%;
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #ccd;
      background: #f7f8fa;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.1s;
    }
    #sidebar-footer button:hover { background: #e8eaf0; }

    /* ── キャンバスエリア ── */
    #canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #f0f2f5;
      overflow: hidden;
    }

    #canvas-scroll {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    #chart-canvas {
      display: block;
      cursor: crosshair;
      background: #fff;
    }

    /* ── ステータスバー ── */
    #statusbar {
      padding: 3px 12px;
      font-size: 11px;
      color: #778;
      background: #e8eaf0;
      border-top: 1px solid #d0d4dc;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── モーダル ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 8px;
      padding: 20px 24px;
      min-width: 300px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .modal h2 { font-size: 15px; margin-bottom: 14px; color: #1e2a3a; }
    .modal label { display: block; font-size: 12px; color: #556; margin-bottom: 3px; margin-top: 10px; }
    .modal input, .modal select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccd;
      border-radius: 4px;
      font-size: 13px;
    }
    .modal input:focus, .modal select:focus { outline: 2px solid #3b82f6; border-color: transparent; }
    .modal .modal-levels { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .modal .level-row { display: flex; gap: 6px; align-items: center; }
    .modal .level-row input { flex: 1; }
    .modal .level-row button { padding: 3px 8px; border: 1px solid #ccd; border-radius: 3px; background: #f5f5f5; cursor: pointer; font-size: 11px; }
    .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .modal .modal-actions button { padding: 6px 18px; border-radius: 4px; border: 1px solid #ccd; cursor: pointer; font-size: 13px; }
    .modal .modal-actions .ok { background: #2563eb; color: #fff; border-color: #2563eb; }
    .modal .modal-actions .ok:hover { background: #1d4ed8; }
    .modal .modal-actions .cancel { background: #fff; }
    .modal .modal-actions .cancel:hover { background: #f5f5f5; }
  </style>
</head>
<body>

<!-- ツールバー -->
<div id="toolbar">
  <h1>⏱ タイミングチャート</h1>
  <div class="tb-sep"></div>
  <span class="tb-label">ツール:</span>
  <button class="tb-btn primary" id="btn-tool-select"  title="選択・移動">選択</button>
  <button class="tb-btn"         id="btn-tool-edge"    title="遷移点を追加">遷移追加</button>
  <button class="tb-btn"         id="btn-tool-annot"   title="時間アノテーション">矢印注釈</button>
  <div class="tb-sep"></div>
  <span class="tb-label">表示:</span>
  <button class="tb-btn" id="btn-zoom-in">＋</button>
  <button class="tb-btn" id="btn-zoom-out">－</button>
  <button class="tb-btn" id="btn-grid-toggle">グリッド</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-undo">元に戻す</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-export-png">PNG保存</button>
  <button class="tb-btn" id="btn-export-svg">SVG保存</button>
  <button class="tb-btn" id="btn-save-json">JSON保存</button>
  <button class="tb-btn" id="btn-load-json">JSON読込</button>
  <input type="file" id="file-input" accept=".json" style="display:none">
</div>

<!-- メイン -->
<div id="main">

  <!-- 左パネル -->
  <div id="sidebar">
    <div id="sidebar-header">信号一覧</div>
    <div id="signal-list"><!-- JS で生成 --></div>
    <div id="sidebar-footer">
      <button id="btn-add-binary">＋ バイナリ信号を追加</button>
      <button id="btn-add-multi">＋ 多値信号を追加</button>
    </div>
  </div>

  <!-- キャンバスエリア -->
  <div id="canvas-area">
    <div id="canvas-scroll">
      <canvas id="chart-canvas"></canvas>
    </div>
    <div id="statusbar">準備完了 | クリック: 遷移点を追加 | 右クリック: 削除</div>
  </div>

</div>

<!-- 信号追加/編集モーダル -->
<div class="modal-overlay" id="modal-signal">
  <div class="modal">
    <h2 id="modal-signal-title">信号を追加</h2>
    <label>信号名</label>
    <input type="text" id="modal-sig-name" placeholder="例: 信号A">
    <div id="modal-binary-opts">
      <label>ONラベル</label>
      <input type="text" id="modal-on-label" value="ON">
      <label>OFFラベル</label>
      <input type="text" id="modal-off-label" value="OFF">
    </div>
    <div id="modal-multi-opts" style="display:none">
      <label>レベル名（上から順に）</label>
      <div class="modal-levels" id="modal-levels-container"></div>
      <button id="btn-add-level" style="margin-top:6px;padding:3px 10px;border:1px solid #ccd;border-radius:3px;background:#f5f5f5;cursor:pointer;font-size:12px;">＋ レベルを追加</button>
    </div>
    <div class="modal-actions">
      <button class="cancel" id="modal-signal-cancel">キャンセル</button>
      <button class="ok"     id="modal-signal-ok">OK</button>
    </div>
  </div>
</div>

<!-- アノテーション編集モーダル -->
<div class="modal-overlay" id="modal-annot">
  <div class="modal">
    <h2>矢印注釈の編集</h2>
    <label>ラベル（例: 3s, 100ms）</label>
    <input type="text" id="modal-annot-label" placeholder="3s">
    <div class="modal-actions">
      <button class="cancel" id="modal-annot-cancel">キャンセル</button>
      <button class="ok danger" id="modal-annot-delete" style="background:#fee2e2;color:#991b1b;border-color:#fca5a5;">削除</button>
      <button class="ok"    id="modal-annot-ok">OK</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
//  Step 1: 骨格のみ – コンソールで動作確認用
// ─────────────────────────────────────────────
console.log('タイミングチャート Step 1: 構造OK');

// ── 定数 ──
const LABEL_WIDTH  = 110; // 左の信号ラベル幅 (px)
const ROW_HEIGHT   = 80;  // 1信号行の高さ (px)
const ROW_PAD      = 16;  // 上下余白
const WAVE_H       = ROW_HEIGHT - ROW_PAD * 2; // 波形の振幅高さ
const HEADER_H     = 24;  // 時間軸ヘッダ高さ
const ANNOT_AREA_H = 50;  // アノテーション行の高さ

// 目盛り間隔の候補（秒）: μs〜分 をカバー
const NICE_STEPS = [
  1e-7, 2e-7, 5e-7,          // 0.1〜0.5 μs
  1e-6, 2e-6, 5e-6,          // 1〜5 μs
  1e-5, 2e-5, 5e-5,          // 10〜50 μs
  1e-4, 2e-4, 5e-4,          // 0.1〜0.5 ms
  1e-3, 2e-3, 5e-3,          // 1〜5 ms
  0.01, 0.02, 0.05,          // 10〜50 ms
  0.1,  0.2,  0.5,           // 100〜500 ms
  1,    2,    5,    10,      // 1〜10 s
  30,   60,   120,  300,     // 30s〜5min
];

// ── アプリ状態 ──
const state = {
  signals: [],      // Signal[]
  events:  [],      // Event[]
  annots:  [],      // Annotation[]
  tool: 'select',   // 'select' | 'edge' | 'annot'
  scale: 80,        // px per second
  totalTime: 10,    // 表示する合計秒数（内部は常に秒）
  unitLabel: 'ms',  // 表示単位ラベル ('μs'|'ms'|'s'|'min')
  unitFactor: 1e-3, // 1 表示単位 = unitFactor 秒
  showGrid: true,
  history: [],      // Undo 用スナップショット
  annotStep: null,  // アノテーション追加中の第1点
  selectedAnnot: null,
};

// ── DOM 参照 ──
const canvas   = document.getElementById('chart-canvas');
const ctx      = canvas.getContext('2d');
const statusEl = document.getElementById('statusbar');

function setStatus(msg) { statusEl.textContent = msg; }

// キャンバスサイズを計算してセット（後の Step で描画処理を追加）
function resizeCanvas() {
  const annotRows = state.annots.length > 0 ? 1 : 0;
  const h = HEADER_H + state.signals.length * ROW_HEIGHT + annotRows * ANNOT_AREA_H + 40;
  const w = Math.max(
    document.getElementById('canvas-scroll').clientWidth,
    LABEL_WIDTH + state.totalTime * state.scale + 60
  );
  canvas.width  = w;
  canvas.height = h;
}

resizeCanvas();

// ════════════════════════════════════════════════
//  Step 2: データモデル – Signal / Event / Annotation
// ════════════════════════════════════════════════

let _nextId = 1;
function uid() { return _nextId++; }

// ── Signal ──
// {
//   id: number,
//   name: string,
//   type: 'binary' | 'multi',
//   levels: string[],   // binary: ['ON','OFF']  multi: ['10b','01b','00b'] (上→下順)
//   color: string,      // 波形の色
// }

// ── Event ──
// {
//   id: number,
//   signalId: number,
//   time: number,       // 秒 (float)
//   value: number,      // levels[] のインデックス (0 = 最上位レベル)
// }
// ※ time 昇順にソートして使う。time=0 より前に初期値として value=末尾レベルを仮定。

// ── Annotation ──
// {
//   id: number,
//   t1: number,   // 開始時刻 (秒)
//   t2: number,   // 終了時刻 (秒)
//   label: string,
// }

const COLORS = [
  '#2563eb','#16a34a','#dc2626','#9333ea',
  '#0891b2','#d97706','#db2777','#65a30d',
];
let _colorIdx = 0;
function nextColor() { return COLORS[(_colorIdx++) % COLORS.length]; }

// ── Signal CRUD ──
function createSignal(name, type, levels) {
  return { id: uid(), name, type, levels: [...levels], color: nextColor() };
}

function addSignal(sig) {
  saveHistory();
  state.signals.push(sig);
  // 初期値: 各信号の最下位レベル(末尾インデックス)を time=0 に設定
  state.events.push({ id: uid(), signalId: sig.id, time: 0, value: sig.levels.length - 1 });
}

function removeSignal(sigId) {
  saveHistory();
  state.signals = state.signals.filter(s => s.id !== sigId);
  state.events  = state.events.filter(e => e.signalId !== sigId);
}

function updateSignalName(sigId, newName) {
  saveHistory();
  const s = state.signals.find(s => s.id === sigId);
  if (s) s.name = newName;
}

// ── Event CRUD ──
function addEvent(signalId, time, value) {
  saveHistory();
  // 同じ時刻に既存イベントがあれば上書き
  const existing = state.events.find(e => e.signalId === signalId && Math.abs(e.time - time) < 0.001);
  if (existing) { existing.value = value; return; }
  state.events.push({ id: uid(), signalId, time, value });
}

function removeEvent(eventId) {
  // time=0 のイベント（初期値）は削除しない
  const ev = state.events.find(e => e.id === eventId);
  if (!ev || ev.time === 0) return;
  saveHistory();
  state.events = state.events.filter(e => e.id !== eventId);
}

// 信号の time=t における現在値インデックスを返す
function getValueAt(signalId, t) {
  const evs = state.events
    .filter(e => e.signalId === signalId && e.time <= t)
    .sort((a, b) => b.time - a.time);
  if (evs.length === 0) {
    const sig = state.signals.find(s => s.id === signalId);
    return sig ? sig.levels.length - 1 : 0;
  }
  return evs[0].value;
}

// 信号のイベントを時刻順に返す（time=0 の初期値含む）
function getSortedEvents(signalId) {
  return state.events
    .filter(e => e.signalId === signalId)
    .sort((a, b) => a.time - b.time);
}

// ── Annotation CRUD ──
function addAnnot(t1, t2, label) {
  saveHistory();
  if (t1 > t2) [t1, t2] = [t2, t1];
  state.annots.push({ id: uid(), t1, t2, label });
}

function removeAnnot(annotId) {
  saveHistory();
  state.annots = state.annots.filter(a => a.id !== annotId);
}

function updateAnnot(annotId, label) {
  saveHistory();
  const a = state.annots.find(a => a.id === annotId);
  if (a) a.label = label;
}

// ── Undo ──
const MAX_HISTORY = 30;

function saveHistory() {
  state.history.push(JSON.stringify({ signals: state.signals, events: state.events, annots: state.annots }));
  if (state.history.length > MAX_HISTORY) state.history.shift();
}

function undo() {
  if (state.history.length === 0) { setStatus('これ以上元に戻せません'); return; }
  const snap = JSON.parse(state.history.pop());
  state.signals = snap.signals;
  state.events  = snap.events;
  state.annots  = snap.annots;
  // id カウンタをリセットしないよう最大値を維持
  refreshAll();
}

// ── サンプルデータ投入（動作確認用）──
function loadSampleData() {
  const sigA = createSignal('信号A', 'binary', ['ON', 'OFF']);
  const sigB = createSignal('信号B', 'binary', ['ON', 'OFF']);
  const sigOut = createSignal('出力', 'multi', ['10b', '01b', '00b']);

  addSignal(sigA);
  addSignal(sigB);
  addSignal(sigOut);

  // 信号A: t=20ms で OFF→ON
  addEvent(sigA.id, 0.020, 0);  // ON

  // 信号B: t=35ms で OFF→ON
  addEvent(sigB.id, 0.035, 0);  // ON

  // 出力: 00b→01b (20ms), 01b→10b (35ms), 10b→00b (65ms)
  addEvent(sigOut.id, 0.020, 1); // 01b
  addEvent(sigOut.id, 0.035, 0); // 10b
  addEvent(sigOut.id, 0.065, 2); // 00b

  // アノテーション: 35ms ～ 65ms = "30ms"
  addAnnot(0.035, 0.065, '30ms');

  // 総時間・スケール（内部は秒）、軸ラベルのみ ms 表示
  state.totalTime  = 0.100; // 0.1s = 100ms
  state.unitLabel  = 'ms';
  state.unitFactor = 1e-3;
  fitToWindow();
}

// ── サイドバー仮描画（Step 8 で本実装）──
function renderSidebar() {
  const list = document.getElementById('signal-list');
  list.innerHTML = '';
  state.signals.forEach((sig, idx) => {
    const item = document.createElement('div');
    item.className = 'signal-item';
    item.dataset.id = sig.id;
    item.innerHTML = `
      <span class="drag-handle" title="ドラッグで並び替え">⠿</span>
      <span class="sig-name" title="クリックで名前を編集">${sig.name}</span>
      <span class="sig-type-badge ${sig.type === 'multi' ? 'multi' : ''}">${sig.type === 'binary' ? '2値' : '多値'}</span>
      <span class="del-btn" title="削除">×</span>
    `;
    item.querySelector('.sig-name').addEventListener('click', () => openEditSignalModal(sig.id));
    item.querySelector('.del-btn').addEventListener('click', () => { removeSignal(sig.id); refreshAll(); });
    list.appendChild(item);
  });
}

// ── モーダル制御（信号追加）──
let _modalMode = 'add-binary'; // 'add-binary' | 'add-multi' | 'edit'
let _editSigId = null;

function openAddSignalModal(type) {
  _modalMode = type === 'binary' ? 'add-binary' : 'add-multi';
  _editSigId = null;
  document.getElementById('modal-signal-title').textContent = type === 'binary' ? 'バイナリ信号を追加' : '多値信号を追加';
  document.getElementById('modal-sig-name').value = '';
  document.getElementById('modal-on-label').value  = 'ON';
  document.getElementById('modal-off-label').value = 'OFF';
  document.getElementById('modal-binary-opts').style.display = type === 'binary' ? '' : 'none';
  document.getElementById('modal-multi-opts').style.display  = type === 'multi'  ? '' : 'none';
  if (type === 'multi') buildLevelRows(['10b', '01b', '00b']);
  document.getElementById('modal-signal').classList.add('open');
  document.getElementById('modal-sig-name').focus();
}

function openEditSignalModal(sigId) {
  const sig = state.signals.find(s => s.id === sigId);
  if (!sig) return;
  _modalMode = 'edit';
  _editSigId = sigId;
  document.getElementById('modal-signal-title').textContent = '信号を編集';
  document.getElementById('modal-sig-name').value = sig.name;
  document.getElementById('modal-binary-opts').style.display = sig.type === 'binary' ? '' : 'none';
  document.getElementById('modal-multi-opts').style.display  = sig.type === 'multi'  ? '' : 'none';
  if (sig.type === 'binary') {
    document.getElementById('modal-on-label').value  = sig.levels[0];
    document.getElementById('modal-off-label').value = sig.levels[1];
  } else {
    buildLevelRows(sig.levels);
  }
  document.getElementById('modal-signal').classList.add('open');
  document.getElementById('modal-sig-name').focus();
}

function buildLevelRows(levels) {
  const container = document.getElementById('modal-levels-container');
  container.innerHTML = '';
  levels.forEach(lv => addLevelRow(lv));
}

function addLevelRow(value = '') {
  const container = document.getElementById('modal-levels-container');
  const row = document.createElement('div');
  row.className = 'level-row';
  row.innerHTML = `<input type="text" value="${value}" placeholder="レベル名"><button class="rm-lv">－</button>`;
  row.querySelector('.rm-lv').addEventListener('click', () => row.remove());
  container.appendChild(row);
}

document.getElementById('btn-add-level').addEventListener('click', () => addLevelRow());
document.getElementById('modal-signal-cancel').addEventListener('click', () => {

});
document.getElementById('modal-signal-ok').addEventListener('click', () => {

// ════════════════════════════════════════════════
//  Step 3: Canvasレンダリングエンジン
// ════════════════════════════════════════════════

// ── 座標変換ヘルパー ──
function timeToX(t) {
  return LABEL_WIDTH + t * state.scale;
}
function xToTime(x) {
  return (x - LABEL_WIDTH) / state.scale;
}
function rowToY(rowIdx) {
  return HEADER_H + rowIdx * ROW_HEIGHT;
}
// 行内の値インデックス → Y座標（0=最上位レベル=波形の上端）
function valueToY(rowIdx, valueIdx, totalLevels) {
  const top = rowToY(rowIdx) + ROW_PAD;
  if (totalLevels <= 1) return top;
  return top + (valueIdx / (totalLevels - 1)) * WAVE_H;
}

// ── 時刻フォーマット（内部秒 → 表示単位文字列）──
function formatTime(seconds) {
  const v = seconds / state.unitFactor;
  // 小数点以下が不要なら整数表示、必要なら最小限の桁数
  const s = Number.isInteger(v) || v >= 10 ? v.toFixed(0) : v.toPrecision(3).replace(/\.?0+$/, '');
  return s + state.unitLabel;
}

// ── メイン描画関数 ──
function drawChart() {
  resizeCanvas();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBackground();
  drawTimeAxis();
  if (state.showGrid) drawGrid();
  drawSignalLabels();
  drawWaveforms();
  drawAnnotationArea();
}

// ── 背景・行の帯 ──
function drawBackground() {
  // キャンバス全体を白に
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 信号行ごとに交互に薄い帯
  state.signals.forEach((sig, i) => {
    ctx.fillStyle = i % 2 === 0 ? '#fafbff' : '#f5f7fc';
    ctx.fillRect(0, rowToY(i), canvas.width, ROW_HEIGHT);
  });

  // ラベル列の背景（常に白）
  ctx.fillStyle = '#f7f8fa';
  ctx.fillRect(0, 0, LABEL_WIDTH, canvas.height);

  // ラベル列右端の縦線
  ctx.strokeStyle = '#dde';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(LABEL_WIDTH, 0);
  ctx.lineTo(LABEL_WIDTH, canvas.height);
  ctx.stroke();
}

// ── 時間軸ヘッダ ──
function drawTimeAxis() {
  // ヘッダ背景
  ctx.fillStyle = '#eef0f6';
  ctx.fillRect(LABEL_WIDTH, 0, canvas.width - LABEL_WIDTH, HEADER_H);
  ctx.strokeStyle = '#ccd';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, HEADER_H);
  ctx.lineTo(canvas.width, HEADER_H);
  ctx.stroke();

  // 目盛り間隔を自動選択（画面上で最低 50px 間隔）
  const rawStep = 50 / state.scale;
  const tickStep = NICE_STEPS.find(s => s >= rawStep) || 300;

  ctx.fillStyle = '#556';
  ctx.font = '10px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  let t = 0;
  while (t <= state.totalTime + tickStep) {
    const x = timeToX(t);
    if (x > LABEL_WIDTH && x < canvas.width) {
      // 目盛り線
      ctx.strokeStyle = '#bbc';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, HEADER_H - 5);
      ctx.lineTo(x, HEADER_H);
      ctx.stroke();
      // ラベル
      const label = formatTime(t);
      ctx.fillText(label, x, HEADER_H / 2);
    }
    t = Math.round((t + tickStep) * 1000) / 1000;
  }

  // "時間" ラベル
  ctx.textAlign = 'center';
  ctx.fillStyle = '#99a';
  ctx.fillText('時間', LABEL_WIDTH / 2, HEADER_H / 2);
}

// ── グリッド線 ──
function drawGrid() {
  const rawStep = 50 / state.scale;
  const tickStep = NICE_STEPS.find(s => s >= rawStep) || 300;

  ctx.strokeStyle = '#e8eaf0';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);

  let t = tickStep;
  while (t <= state.totalTime) {
    const x = timeToX(t);
    ctx.beginPath();
    ctx.moveTo(x, HEADER_H);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
    t = Math.round((t + tickStep) * 1000) / 1000;
  }
  ctx.setLineDash([]);

  // 行の区切り線
  ctx.strokeStyle = '#dde';
  ctx.lineWidth = 1;
  state.signals.forEach((_, i) => {
    const y = rowToY(i + 1);
    ctx.beginPath();
    ctx.moveTo(LABEL_WIDTH, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  });
}

// ── 信号ラベル ──
function drawSignalLabels() {
  state.signals.forEach((sig, i) => {
    const cy = rowToY(i) + ROW_HEIGHT / 2;

    // 信号名
    ctx.fillStyle = '#1e2a3a';
    ctx.font = 'bold 12px Segoe UI, Meiryo, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(sig.name, 8, cy);

    // レベル名（右端）
    const n = sig.levels.length;
    ctx.font = '10px Segoe UI, monospace';
    ctx.fillStyle = '#778';
    sig.levels.forEach((lv, vi) => {
      const y = valueToY(i, vi, n);
      ctx.textAlign = 'right';
      ctx.fillText(lv, LABEL_WIDTH - 6, y);
    });
  });
}

// ── アノテーション行（プレースホルダ）──
function drawAnnotationArea() {
  if (state.annots.length === 0) return;
  const y = rowToY(state.signals.length);
  ctx.fillStyle = '#f0f4ff';
  ctx.fillRect(0, y, canvas.width, ANNOT_AREA_H);
  ctx.strokeStyle = '#dde';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(canvas.width, y);
  ctx.stroke();
  // "アノテーション" ラベル
  ctx.fillStyle = '#99a';
  ctx.font = '10px Segoe UI, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('注釈', 8, y + ANNOT_AREA_H / 2);
}

// ── 画面幅に合わせてスケールを自動調整 ──
function fitToWindow() {
  const scrollW = document.getElementById('canvas-scroll').clientWidth - LABEL_WIDTH - 20;
  if (scrollW > 0 && state.totalTime > 0) {
    state.scale = Math.round(scrollW / state.totalTime);
  }
}

// ── refreshAll: サイドバー更新 + Canvas再描画 ──
function refreshAll() {
  renderSidebar();
  resizeCanvas();
  drawChart();
}

// ════════════════════════════════════════════════
//  Step 4: 波形描画
// ════════════════════════════════════════════════

function drawWaveforms() {
  state.signals.forEach((sig, rowIdx) => {
    const evs = getSortedEvents(sig.id);
    const n   = sig.levels.length;
    const endT = state.totalTime;

    // 描画区間リストを作成: [{t0, t1, value}, ...]
    // evs[0] は必ず time=0 の初期値
    const segments = [];
    for (let i = 0; i < evs.length; i++) {
      const t0  = evs[i].time;
      const val = evs[i].value;
      const t1  = i + 1 < evs.length ? evs[i + 1].time : endT;
      if (t1 > t0) segments.push({ t0, t1, val });
    }

    ctx.save();
    // 描画領域をキャンバス幅にクリップ
    ctx.beginPath();
    ctx.rect(LABEL_WIDTH, rowToY(rowIdx), canvas.width - LABEL_WIDTH, ROW_HEIGHT);
    ctx.clip();

    ctx.strokeStyle = sig.color;
    ctx.lineWidth   = 2;
    ctx.lineJoin    = 'miter';

    if (n === 2) {
      // ── バイナリ信号（矩形波）──
      drawBinaryWave(rowIdx, segments, n, sig.color);
    } else {
      // ── 多値信号 ──
      drawMultiWave(rowIdx, segments, n, sig.color);
    }

    ctx.restore();
  });
}

// ── バイナリ波形 ──
function drawBinaryWave(rowIdx, segments, n, color) {
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth   = 2;

  let firstMove = true;
  segments.forEach((seg, si) => {
    const x0 = timeToX(seg.t0);
    const x1 = timeToX(seg.t1);
    const y  = valueToY(rowIdx, seg.val, n);

    if (firstMove) {
      ctx.moveTo(x0, y);
      firstMove = false;
    }

    // 遷移エッジ（垂直線）: 前のセグメントと値が違う場合
    if (si > 0 && segments[si - 1].val !== seg.val) {
      ctx.lineTo(x0, y); // 垂直遷移
    }

    // 水平線
    ctx.lineTo(x1, y);
  });
  ctx.stroke();

  // 遷移点に小さい縦マーカー
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.35;
  segments.forEach((seg, si) => {
    if (si === 0) return;
    if (segments[si - 1].val === seg.val) return;
    const x  = timeToX(seg.t0);
    const y0 = rowToY(rowIdx) + ROW_PAD / 2;
    const y1 = rowToY(rowIdx) + ROW_HEIGHT - ROW_PAD / 2;
    ctx.beginPath();
    ctx.setLineDash([4, 3]);
    ctx.moveTo(x, y0);
    ctx.lineTo(x, y1);
    ctx.stroke();
    ctx.setLineDash([]);
  });
  ctx.globalAlpha = 1;
}

// ── 多値波形（台形エッジ）──
const MULTI_SLOPE = 4; // エッジの水平幅 (px)

function drawMultiWave(rowIdx, segments, n, color) {
  segments.forEach((seg, si) => {
    const x0raw = timeToX(seg.t0);
    const x1raw = timeToX(seg.t1);
    const yMid  = valueToY(rowIdx, seg.val, n);
    const yTop  = rowToY(rowIdx) + ROW_PAD;
    const yBot  = rowToY(rowIdx) + ROW_PAD + WAVE_H;

    const hasLeft  = si > 0;
    const hasRight = si < segments.length - 1;

    const x0 = hasLeft  ? x0raw + MULTI_SLOPE : x0raw;
    const x1 = hasRight ? x1raw - MULTI_SLOPE : x1raw;

    // 上辺・下辺（水平線）
    ctx.strokeStyle = color;
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.moveTo(x0, yTop);
    ctx.lineTo(x1, yTop);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x0, yBot);
    ctx.lineTo(x1, yBot);
    ctx.stroke();

    // 塗りつぶし（半透明）
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.08;
    ctx.fillRect(x0, yTop, x1 - x0, yBot - yTop);
    ctx.globalAlpha = 1;

    // 左側エッジ（菱形）
    if (hasLeft) {
      ctx.strokeStyle = color;
      ctx.lineWidth   = 1.5;
      ctx.beginPath();
      ctx.moveTo(x0raw, yMid);
      ctx.lineTo(x0raw + MULTI_SLOPE, yTop);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x0raw, yMid);
      ctx.lineTo(x0raw + MULTI_SLOPE, yBot);
      ctx.stroke();
    }

    // 右側エッジ
    if (hasRight) {
      ctx.beginPath();
      ctx.moveTo(x1raw, yMid);
      ctx.lineTo(x1raw - MULTI_SLOPE, yTop);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1raw, yMid);
      ctx.lineTo(x1raw - MULTI_SLOPE, yBot);
      ctx.stroke();
    }

    // セグメントの中央にレベル名
    const midX = (x0 + x1) / 2;
    const segW  = x1 - x0;
    if (segW > 20) {
      const sig = state.signals.find(s => s.color === color);
      const lv  = sig ? sig.levels[seg.val] : '';
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.85;
      ctx.font = `bold ${Math.min(11, segW / lv.length * 1.2)}px monospace`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(lv, midX, yTop + (yBot - yTop) / 2);
      ctx.globalAlpha = 1;
    }
  });
}

// ════════════════════════════════════════════════
//  Step 5: 信号ラベル・レベル名の編集UI
// ════════════════════════════════════════════════

// ── ラベル列のヒットテスト ──
// クリック座標がどの信号のどの要素に当たるか判定する
// 返値: { type: 'sigName'|'level', sigId, levelIdx } or null
function hitTestLabel(x, y) {
  if (x > LABEL_WIDTH) return null;

  for (let i = 0; i < state.signals.length; i++) {
    const sig  = state.signals[i];
    const rowY = rowToY(i);
    if (y < rowY || y >= rowY + ROW_HEIGHT) continue;

    const n = sig.levels.length;

    // 各レベル名の当たり判定（右寄せテキスト周辺 ±8px）
    for (let vi = 0; vi < n; vi++) {
      const ly = valueToY(i, vi, n);
      if (Math.abs(y - ly) < 9) {
        return { type: 'level', sigId: sig.id, levelIdx: vi };
      }
    }

    // 信号名（行の左上エリア）
    return { type: 'sigName', sigId: sig.id };
  }
  return null;
}

// ── インライン編集オーバーレイ ──
// Canvas上に <input> を重ねて表示する
let _inlineInput = null;

function showInlineInput(x, y, width, initVal, onCommit) {
  removeInlineInput();

  const scroll  = document.getElementById('canvas-scroll');
  const scrollRect = scroll.getBoundingClientRect();
  const canvasRect = canvas.getBoundingClientRect();

  const inp = document.createElement('input');
  inp.type  = 'text';
  inp.value = initVal;
  inp.style.cssText = `
    position: absolute;
    left:   ${x - scroll.scrollLeft}px;
    top:    ${y - scroll.scrollTop}px;
    width:  ${width}px;
    height: 20px;
    padding: 1px 4px;
    font-size: 11px;
    font-family: Segoe UI, Meiryo, sans-serif;
    border: 1.5px solid #3b82f6;
    border-radius: 3px;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    z-index: 50;
    outline: none;
  `;

  function commit() {
    const val = inp.value.trim();
    removeInlineInput();
    if (val) onCommit(val);
  }

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter')  commit();
    if (e.key === 'Escape') removeInlineInput();
    e.stopPropagation();
  });
  inp.addEventListener('blur', commit);

  scroll.appendChild(inp);
  _inlineInput = inp;
  inp.focus();
  inp.select();
}

function removeInlineInput() {
  if (_inlineInput) {
    _inlineInput.removeEventListener('blur', ()=>{});
    _inlineInput.remove();
    _inlineInput = null;
  }
}

// ── ラベル列クリックの処理 ──
function handleLabelClick(x, y) {
  const hit = hitTestLabel(x, y);
  if (!hit) return false;

  const scroll = document.getElementById('canvas-scroll');
  const ox = scroll.scrollLeft;
  const oy = scroll.scrollTop;

  if (hit.type === 'sigName') {
    const sig  = state.signals.find(s => s.id === hit.sigId);
    const rowI = state.signals.indexOf(sig);
    const iy   = rowToY(rowI) + 4;
    showInlineInput(8, iy, LABEL_WIDTH - 12, sig.name, newName => {
      saveHistory();
      sig.name = newName;
      refreshAll();
    });
    return true;
  }

  if (hit.type === 'level') {
    const sig    = state.signals.find(s => s.id === hit.sigId);
    const rowI   = state.signals.indexOf(sig);
    const vi     = hit.levelIdx;
    const ly     = valueToY(rowI, vi, sig.levels.length);
    const inputW = LABEL_WIDTH - 12;
    showInlineInput(LABEL_WIDTH - inputW - 2, ly - 10, inputW, sig.levels[vi], newLabel => {
      saveHistory();
      sig.levels[vi] = newLabel;
      // イベントの value インデックスは変えず、ラベルだけ変更
      refreshAll();
    });
    return true;
  }

  return false;
}

// ── サイドバー信号名クリックでもインライン編集を開く ──
// （Step 2 の openEditSignalModal を差し替え）
function openEditSignalModal(sigId) {
  const sig = state.signals.find(s => s.id === sigId);
  if (!sig) return;
  _modalMode = 'edit';
  _editSigId = sigId;
  document.getElementById('modal-signal-title').textContent = '信号を編集';
  document.getElementById('modal-sig-name').value = sig.name;
  document.getElementById('modal-binary-opts').style.display = sig.type === 'binary' ? '' : 'none';
  document.getElementById('modal-multi-opts').style.display  = sig.type === 'multi'  ? '' : 'none';
  if (sig.type === 'binary') {
    document.getElementById('modal-on-label').value  = sig.levels[0];
    document.getElementById('modal-off-label').value = sig.levels[1];
  } else {
    buildLevelRows(sig.levels);
  }
  document.getElementById('modal-signal').classList.add('open');
  document.getElementById('modal-sig-name').focus();
}

// モーダルOK時にレベル変更も反映
const _origModalOk = document.getElementById('modal-signal-ok');
_origModalOk.addEventListener('click', () => {
  if (_modalMode !== 'edit') return;
  const sig = state.signals.find(s => s.id === _editSigId);
  if (!sig) return;
  if (sig.type === 'binary') {
    const on  = document.getElementById('modal-on-label').value.trim()  || 'ON';
    const off = document.getElementById('modal-off-label').value.trim() || 'OFF';
    saveHistory();
    sig.levels[0] = on;
    sig.levels[1] = off;
    refreshAll();
  } else {
    const rows   = document.querySelectorAll('#modal-levels-container .level-row input');
    const newLvs = [...rows].map(r => r.value.trim() || '?');
    if (newLvs.length < 2) { alert('レベルは2つ以上必要です'); return; }
    saveHistory();
    // レベル数が変わった場合、既存のイベント value をクランプ
    sig.levels = newLvs;
    state.events
      .filter(e => e.signalId === sig.id)
      .forEach(e => { if (e.value >= newLvs.length) e.value = newLvs.length - 1; });
    refreshAll();
  }
}, { once: false });

// ── Canvas クリックでラベル編集を優先処理 ──
// (Step 6 のクリックハンドラと統合するため関数として公開)
function onCanvasClick(e) {
  if (e.button !== 0) return;
  const rect = canvas.getBoundingClientRect();
  const scroll = document.getElementById('canvas-scroll');
  const x = e.clientX - rect.left + scroll.scrollLeft;
  const y = e.clientY - rect.top  + scroll.scrollTop;

  // ラベル列クリック → 編集
  if (x < LABEL_WIDTH) {
    handleLabelClick(x, y);
    return;
  }
  // 波形エリアのクリックは Step 6 で実装
}

canvas.addEventListener('click',       onCanvasClick);
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ── カーソル切り替え（ラベル列はテキスト編集カーソル）──
canvas.addEventListener('mousemove', e => {
  const rect   = canvas.getBoundingClientRect();
  const scroll = document.getElementById('canvas-scroll');
  const x = e.clientX - rect.left + scroll.scrollLeft;
  const y = e.clientY - rect.top  + scroll.scrollTop;

  if (x < LABEL_WIDTH) {
    const hit = hitTestLabel(x, y);
    canvas.style.cursor = hit ? 'text' : 'default';
  } else {
    canvas.style.cursor = state.tool === 'select' ? 'default' : 'crosshair';
  }
});

// ════════════════════════════════════════════════
//  Step 6: 遷移点の追加・移動・削除
// ════════════════════════════════════════════════

// ── 波形エリアのヒットテスト ──
const EDGE_HIT_PX = 8; // 遷移点の当たり判定幅(px)

// 指定座標に最も近い遷移点イベントを返す（time=0 は除く）
function hitTestEdge(x, y) {
  for (let i = 0; i < state.signals.length; i++) {
    const sig  = state.signals[i];
    const rowY = rowToY(i);
    if (y < rowY || y >= rowY + ROW_HEIGHT) continue;

    const evs = getSortedEvents(sig.id).filter(e => e.time > 0);
    for (const ev of evs) {
      const ex = timeToX(ev.time);
      if (Math.abs(x - ex) <= EDGE_HIT_PX) {
        return { ev, sig, rowIdx: i };
      }
    }
  }
  return null;
}

// 指定座標がどの信号行・どのレベルに当たるか返す
function hitTestWaveArea(x, y) {
  for (let i = 0; i < state.signals.length; i++) {
    const sig  = state.signals[i];
    const rowY = rowToY(i);
    if (y < rowY || y >= rowY + ROW_HEIGHT) continue;

    const t = xToTime(x);
    if (t < 0) return null;

    const n   = sig.levels.length;
    // クリックY座標から最も近いレベルインデックスを選ぶ
    let best = 0, bestDist = Infinity;
    for (let vi = 0; vi < n; vi++) {
      const vy = valueToY(i, vi, n);
      const d  = Math.abs(y - vy);
      if (d < bestDist) { bestDist = d; best = vi; }
    }
    return { sig, rowIdx: i, t, valueIdx: best };
  }
  return null;
}

// ── ドラッグ状態 ──
const drag = {
  active:  false,
  ev:      null,   // 移動中の Event オブジェクト
  sig:     null,
  origTime: 0,
  snapped: false,
};

// ── 遷移点の描画（ハイライト）──
// drawChart() 内で呼ぶために drawWaveforms の後に差し込む
function drawEdgeHandles() {
  state.signals.forEach((sig, i) => {
    const evs = getSortedEvents(sig.id).filter(e => e.time > 0);
    evs.forEach(ev => {
      const x  = timeToX(ev.time);
      const y0 = rowToY(i) + ROW_PAD / 2;
      const y1 = rowToY(i) + ROW_HEIGHT - ROW_PAD / 2;

      // ドラッグ中のものはオレンジ、それ以外は半透明
      const isDragging = drag.active && drag.ev && drag.ev.id === ev.id;
      ctx.strokeStyle = isDragging ? '#f97316' : sig.color;
      ctx.globalAlpha = isDragging ? 1.0 : 0.0; // 普段は非表示（hover で表示）
      ctx.lineWidth   = isDragging ? 2 : 1;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(x, y0);
      ctx.lineTo(x, y1);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
  });
}

// hover 中の遷移点を追跡してカーソル変更 + ハンドル表示
let _hoveredEdge = null;

canvas.addEventListener('mousemove', e => {
  // Step5 のハンドラと共存（再登録ではなく上書き）
  const rect   = canvas.getBoundingClientRect();
  const scroll = document.getElementById('canvas-scroll');
  const x = e.clientX - rect.left + scroll.scrollLeft;
  const y = e.clientY - rect.top  + scroll.scrollTop;

  if (drag.active) {
    handleDragMove(x, y);
    return;
  }

  if (x < LABEL_WIDTH) {
    const hit = hitTestLabel(x, y);
    canvas.style.cursor = hit ? 'text' : 'default';
    return;
  }

  if (state.tool === 'select' || state.tool === 'edge') {
    const hit = hitTestEdge(x, y);
    if (hit) {
      canvas.style.cursor = 'ew-resize';
      _hoveredEdge = hit;
      // ハンドルをハイライト描画
      drawChart();
      const ex  = timeToX(hit.ev.time);
      const y0  = rowToY(hit.rowIdx) + ROW_PAD / 2;
      const y1  = rowToY(hit.rowIdx) + ROW_HEIGHT - ROW_PAD / 2;
      ctx.strokeStyle = hit.sig.color;
      ctx.globalAlpha = 0.7;
      ctx.lineWidth   = 2;
      ctx.setLineDash([3, 2]);
      ctx.beginPath();
      ctx.moveTo(ex, y0);
      ctx.lineTo(ex, y1);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      return;
    } else {
      _hoveredEdge = null;
    }
  }

  canvas.style.cursor = state.tool === 'annot' ? 'crosshair' :
                        state.tool === 'edge'   ? 'crosshair' : 'default';
  drawChart();
}, true); // capture で Step5 のハンドラを上書き

// ── マウスダウン：ドラッグ開始 or 追加 ──
canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const rect   = canvas.getBoundingClientRect();
  const scroll = document.getElementById('canvas-scroll');
  const x = e.clientX - rect.left + scroll.scrollLeft;
  const y = e.clientY - rect.top  + scroll.scrollTop;

  if (x < LABEL_WIDTH) return; // ラベル列は Step5 が担当

  // 既存の遷移点をドラッグ
  const edgeHit = hitTestEdge(x, y);
  if (edgeHit && (state.tool === 'select' || state.tool === 'edge')) {
    drag.active   = true;
    drag.ev       = edgeHit.ev;
    drag.sig      = edgeHit.sig;
    drag.origTime = edgeHit.ev.time;
    saveHistory();
    e.preventDefault();
    return;
  }
});

// ── ドラッグ移動 ──
function handleDragMove(x, y) {
  if (!drag.active || !drag.ev) return;
  let t = snapTime(xToTime(x));
  t = Math.max(0.05, Math.min(state.totalTime, t));

  // time=0 のイベントとの重複を避ける
  if (t <= 0) t = 0.05;

  drag.ev.time = t;
  drawChart();

  // ドラッグ中のライン強調
  const ex = timeToX(t);
  const i  = state.signals.indexOf(drag.sig);
  const y0 = rowToY(i) + ROW_PAD / 2;
  const y1 = rowToY(i) + ROW_HEIGHT - ROW_PAD / 2;
  ctx.strokeStyle = '#f97316';
  ctx.lineWidth   = 2;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  ctx.moveTo(ex, y0); ctx.lineTo(ex, y1);
  ctx.stroke();
  ctx.setLineDash([]);

  setStatus(`移動中: ${drag.sig.name}  t = ${t.toFixed(3)}s`);
}

// ── マウスアップ：ドラッグ確定 or クリック ──
canvas.addEventListener('mouseup', e => {
  if (e.button !== 0) return;
  const rect   = canvas.getBoundingClientRect();
  const scroll = document.getElementById('canvas-scroll');
  const x = e.clientX - rect.left + scroll.scrollLeft;
  const y = e.clientY - rect.top  + scroll.scrollTop;

  if (drag.active) {
    drag.active = false;
    drag.ev     = null;
    refreshAll();
    setStatus('遷移点を移動しました');
    return;
  }
});

// Step5 の onCanvasClick に波形エリア処理を追加
// 既存の addEventListener('click') を拡張する（既登録のものと共存）
canvas.addEventListener('click', e => {
  if (e.button !== 0) return;
  const rect   = canvas.getBoundingClientRect();
  const scroll = document.getElementById('canvas-scroll');
  const x = e.clientX - rect.left + scroll.scrollLeft;
  const y = e.clientY - rect.top  + scroll.scrollTop;

  if (x < LABEL_WIDTH) return; // ラベル列は既存ハンドラが処理

  if (state.tool === 'edge') {
    // 既存の遷移点に近い場合は無視（ドラッグ用）
    if (hitTestEdge(x, y)) return;

    const hit = hitTestWaveArea(x, y);
    if (!hit) return;

    const t = snapTime(hit.t);
    // その時刻の直前の値を取得して「次の値」に遷移
    const curVal = getValueAt(hit.sig.id, t - 0.001);
    const n      = hit.sig.levels.length;
    // バイナリは反転、多値はクリックY位置から一番近いレベルへ
    const newVal = n === 2 ? (curVal === 0 ? 1 : 0) : hit.valueIdx;

    addEvent(hit.sig.id, t, newVal);
    refreshAll();
    setStatus(`遷移追加: ${hit.sig.name}  t=${t.toFixed(3)}s → ${hit.sig.levels[newVal]}`);
    return;
  }

  if (state.tool === 'select') {
    setStatus('ヒント: 遷移点をドラッグで移動 | 右クリックで削除 | ツール→「遷移追加」でクリック追加');
  }
});

// ── 右クリックで遷移点を削除 ──
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const rect   = canvas.getBoundingClientRect();
  const scroll = document.getElementById('canvas-scroll');
  const x = e.clientX - rect.left + scroll.scrollLeft;
  const y = e.clientY - rect.top  + scroll.scrollTop;

  if (x < LABEL_WIDTH) return;

  const hit = hitTestEdge(x, y);
  if (hit) {
    removeEvent(hit.ev.id);
    refreshAll();
    setStatus(`遷移点を削除しました: ${hit.sig.name}  t=${hit.ev.time.toFixed(3)}s`);
  }
});

// ── スナップ（グリッドに吸着）──
function snapTime(t) {
  if (!state.showGrid) return t;
  const rawStep = 50 / state.scale;
  const step = NICE_STEPS.find(s => s >= rawStep) || 300;
  const snapped = Math.round(t / step) * step;
  // グリッドに近い（1/4 step 以内）場合のみ吸着
  return Math.abs(t - snapped) < step * 0.25 ? snapped : t;
}

// ── ツールボタンの切り替え ──
const toolBtns = {
  select: document.getElementById('btn-tool-select'),
  edge:   document.getElementById('btn-tool-edge'),
  annot:  document.getElementById('btn-tool-annot'),
};
function setTool(name) {
  state.tool = name;
  Object.entries(toolBtns).forEach(([k, btn]) => {
    btn.classList.toggle('primary', k === name);
  });
  const hints = {
    select: '選択モード: 遷移点をドラッグで移動 | 右クリックで削除',
    edge:   '遷移追加モード: 波形エリアをクリックで遷移追加 | ドラッグで移動 | 右クリックで削除',
    annot:  '矢印注釈モード: 開始時刻→終了時刻の順にクリック (Step 7 で実装)',
  };
  setStatus(hints[name] || '');
}
toolBtns.select.addEventListener('click', () => setTool('select'));
toolBtns.edge.addEventListener('click',   () => setTool('edge'));
toolBtns.annot.addEventListener('click',  () => setTool('annot'));

// ════════════════════════════════════════════════
//  Step 7: 時間アノテーション
// ════════════════════════════════════════════════

// ── アノテーション行の描画（本実装）──
// drawAnnotationArea() を上書き
function drawAnnotationArea() {
  if (state.annots.length === 0 && state.annotStep === null) return;

  const y = rowToY(state.signals.length);
  const h = ANNOT_AREA_H;

  // 背景
  ctx.fillStyle = '#f8f9ff';
  ctx.fillRect(0, y, canvas.width, h);
  ctx.strokeStyle = '#dde';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();

  // ラベル
  ctx.fillStyle = '#aab';
  ctx.font = '10px Segoe UI, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('注釈', 8, y + h / 2);

  // 各アノテーションを描画
  state.annots.forEach(a => drawAnnot(a, y, h, false));

  // 追加中のプレビュー
  if (state.annotStep !== null && _annotPreviewX !== null) {
    const t1 = state.annotStep;
    const t2 = xToTime(_annotPreviewX);
    drawAnnotPreview(Math.min(t1,t2), Math.max(t1,t2), y, h);
    // 第1点の縦線プレビュー
    drawAnnotDashedLine(state.annotStep, y);
  }

  // 全アノテーションの縦破線をキャンバス全体に描画
  state.annots.forEach(a => {
    drawAnnotDashedLine(a.t1, y);
    drawAnnotDashedLine(a.t2, y);
  });
}

// 縦破線（全行にわたって表示）
function drawAnnotDashedLine(t, annotRowY) {
  const x = timeToX(t);
  ctx.save();
  ctx.strokeStyle = '#888';
  ctx.lineWidth   = 1;
  ctx.setLineDash([5, 4]);
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.moveTo(x, HEADER_H);
  ctx.lineTo(x, annotRowY + ANNOT_AREA_H);
  ctx.stroke();
  ctx.restore();
}

// 双方向矢印 + ラベルを描画
function drawAnnot(a, rowY, rowH, isPreview) {
  const x1   = timeToX(a.t1);
  const x2   = timeToX(a.t2);
  const ay   = rowY + rowH / 2;
  const AR   = 7;   // 矢印の長さ
  const color = isPreview ? '#94a3b8' : '#2563eb';

  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle   = color;
  ctx.lineWidth   = 1.5;
  ctx.globalAlpha = isPreview ? 0.5 : 1;

  // 水平線
  ctx.beginPath();
  ctx.moveTo(x1, ay);
  ctx.lineTo(x2, ay);
  ctx.stroke();

  // 左矢印
  ctx.beginPath();
  ctx.moveTo(x1, ay);
  ctx.lineTo(x1 + AR, ay - AR * 0.5);
  ctx.lineTo(x1 + AR, ay + AR * 0.5);
  ctx.closePath();
  ctx.fill();

  // 右矢印
  ctx.beginPath();
  ctx.moveTo(x2, ay);
  ctx.lineTo(x2 - AR, ay - AR * 0.5);
  ctx.lineTo(x2 - AR, ay + AR * 0.5);
  ctx.closePath();
  ctx.fill();

  // 垂直の端線
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x1, ay - 8); ctx.lineTo(x1, ay + 8); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, ay - 8); ctx.lineTo(x2, ay + 8); ctx.stroke();

  // ラベル（中央）
  const midX = (x1 + x2) / 2;
  const lbl  = a.label || '';
  ctx.font         = 'bold 12px Segoe UI, sans-serif';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  // 背景を抜く
  const tw = ctx.measureText(lbl).width + 8;
  ctx.fillStyle = '#f8f9ff';
  ctx.globalAlpha = isPreview ? 0.4 : 0.9;
  ctx.fillRect(midX - tw / 2, ay - 8, tw, 16);
  ctx.globalAlpha = isPreview ? 0.5 : 1;
  ctx.fillStyle = color;
  ctx.fillText(lbl, midX, ay);

  ctx.restore();
}

// プレビュー（ラベルなし）
function drawAnnotPreview(t1, t2, rowY, rowH) {
  drawAnnot({ t1, t2, label: '' }, rowY, rowH, true);
}

// ── アノテーションのヒットテスト ──
function hitTestAnnot(x, y) {
  if (state.annots.length === 0) return null;
  const rowY = rowToY(state.signals.length);
  if (y < rowY || y >= rowY + ANNOT_AREA_H) return null;

  const ay = rowY + ANNOT_AREA_H / 2;
  for (const a of state.annots) {
    const x1 = timeToX(a.t1);
    const x2 = timeToX(a.t2);
    // 矢印線上 or 端点付近
    if (x >= x1 - 6 && x <= x2 + 6 && Math.abs(y - ay) < 12) return a;
  }
  return null;
}

// ── アノテーション追加モードのクリック ──
let _annotPreviewX = null;

// mousemove でプレビューX座標を更新
canvas.addEventListener('mousemove', e => {
  if (state.tool !== 'annot') return;
  const rect   = canvas.getBoundingClientRect();
  const scroll = document.getElementById('canvas-scroll');
  _annotPreviewX = e.clientX - rect.left + scroll.scrollLeft;
  if (state.annotStep !== null) drawChart();
}, false);

canvas.addEventListener('click', e => {
  if (e.button !== 0) return;
  if (state.tool !== 'annot') return;

  const rect   = canvas.getBoundingClientRect();
  const scroll = document.getElementById('canvas-scroll');
  const x = e.clientX - rect.left + scroll.scrollLeft;
  const y = e.clientY - rect.top  + scroll.scrollTop;
  if (x < LABEL_WIDTH) return;

  const t = snapTime(xToTime(x));

  if (state.annotStep === null) {
    // 第1点
    state.annotStep = t;
    setStatus(`矢印注釈: 終了時刻をクリックしてください (開始: ${t.toFixed(3)}s)`);
  } else {
    // 第2点 → アノテーション追加 → ラベル入力モーダル
    const t1 = Math.min(state.annotStep, t);
    const t2 = Math.max(state.annotStep, t);
    state.annotStep    = null;
    _annotPreviewX     = null;

    // ラベル入力モーダルを開く
    _pendingAnnot = { t1, t2 };
    document.getElementById('modal-annot-label').value = '';
    document.getElementById('modal-annot-delete').style.display = 'none';
    document.getElementById('modal-annot').classList.add('open');
    document.getElementById('modal-annot-label').focus();
    refreshAll();
  }
}, false);

// 第1点設定後に Escape でキャンセル
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.annotStep !== null) {
    state.annotStep = null;
    _annotPreviewX  = null;
    drawChart();
    setStatus('矢印注釈をキャンセルしました');
  }
});

// ── アノテーション右クリックで編集/削除 ──
canvas.addEventListener('contextmenu', e => {
  // Step6 と共存（波形エリアは Step6 が処理）
  const rect   = canvas.getBoundingClientRect();
  const scroll = document.getElementById('canvas-scroll');
  const x = e.clientX - rect.left + scroll.scrollLeft;
  const y = e.clientY - rect.top  + scroll.scrollTop;

  const hit = hitTestAnnot(x, y);
  if (!hit) return;

  e.preventDefault();
  e.stopImmediatePropagation();
  _pendingAnnot = hit;
  document.getElementById('modal-annot-label').value = hit.label;
  document.getElementById('modal-annot-delete').style.display = '';
  document.getElementById('modal-annot').classList.add('open');
  document.getElementById('modal-annot-label').focus();
}, true); // capture で先に処理

// ── アノテーションモーダルの制御 ──
let _pendingAnnot = null;

document.getElementById('modal-annot-cancel').addEventListener('click', () => {
  document.getElementById('modal-annot').classList.remove('open');
  _pendingAnnot = null;
});

document.getElementById('modal-annot-ok').addEventListener('click', () => {
  const lbl = document.getElementById('modal-annot-label').value.trim();
  if (_pendingAnnot) {
    if (_pendingAnnot.id) {
      updateAnnot(_pendingAnnot.id, lbl);
    } else {
      addAnnot(_pendingAnnot.t1, _pendingAnnot.t2, lbl);
    }
  }
  document.getElementById('modal-annot').classList.remove('open');
  _pendingAnnot = null;
  refreshAll();
});

document.getElementById('modal-annot-delete').addEventListener('click', () => {
  if (_pendingAnnot && _pendingAnnot.id) removeAnnot(_pendingAnnot.id);
  document.getElementById('modal-annot').classList.remove('open');

  refreshAll();
});

// Enterキーでモーダルを確定
document.getElementById('modal-annot-label').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('modal-annot-ok').click();
  if (e.key === 'Escape') document.getElementById('modal-annot-cancel').click();
});

// アノテーション行のカーソル変更
canvas.addEventListener('mousemove', e => {
  const rect   = canvas.getBoundingClientRect();

// ── サイドバー描画（本実装・Step2を上書き）──
function renderSidebar() {
  const list = document.getElementById('signal-list');
  list.innerHTML = '';

  state.signals.forEach((sig, idx) => {
    const item = document.createElement('div');
    item.className = 'signal-item';
    item.draggable = true;
    item.dataset.id  = sig.id;
    item.dataset.idx = idx;

    item.innerHTML = `
      <span class="drag-handle" title="ドラッグで並び替え">⠿</span>
      <span class="sig-color-dot" title="色を変更" style="
        display:inline-block;width:10px;height:10px;border-radius:50%;
        background:${sig.color};flex-shrink:0;cursor:pointer;border:1px solid #ccc;
      "></span>
      <span class="sig-name" title="クリックで名前を編集">${escHtml(sig.name)}</span>
      <span class="sig-type-badge ${sig.type==='multi'?'multi':''}">${sig.type==='binary'?'2値':'多値'}</span>
      <span class="del-btn" title="削除">×</span>
    `;

    // 信号名クリック → 編集モーダル
    item.querySelector('.sig-name').addEventListener('click', () => openEditSignalModal(sig.id));

    // 色ドットクリック → カラーピッカー
    item.querySelector('.sig-color-dot').addEventListener('click', e => {
      e.stopPropagation();
      openColorPicker(sig.id, e.target);
    });

    // 削除ボタン
    item.querySelector('.del-btn').addEventListener('click', e => {
      e.stopPropagation();
      if (state.signals.length <= 1) { setStatus('信号は最低1つ必要です'); return; }
      removeSignal(sig.id);
      refreshAll();
    });

    // ── ドラッグ&ドロップ ──
    item.addEventListener('dragstart', onDragStart);
    item.addEventListener('dragover',  onDragOver);
    item.addEventListener('dragleave', onDragLeave);
    item.addEventListener('drop',      onDrop);
    item.addEventListener('dragend',   onDragEnd);

    list.appendChild(item);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── ドラッグ状態 ──
let _dragSrcIdx = null;

function onDragStart(e) {
  _dragSrcIdx = parseInt(this.dataset.idx);
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', _dragSrcIdx);
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  // ドロップ先をハイライト
  document.querySelectorAll('.signal-item').forEach(el => el.classList.remove('drop-target'));
  this.classList.add('drop-target');
}

function onDragLeave() {
  this.classList.remove('drop-target');
}

function onDrop(e) {
  e.preventDefault();
  const destIdx = parseInt(this.dataset.idx);
  if (_dragSrcIdx === null || _dragSrcIdx === destIdx) return;

  saveHistory();
  // 配列の要素を入れ替え
  const moved = state.signals.splice(_dragSrcIdx, 1)[0];
  state.signals.splice(destIdx, 0, moved);

  refreshAll();
  setStatus(`「${moved.name}」を移動しました`);
}

function onDragEnd() {
  _dragSrcIdx = null;
  document.querySelectorAll('.signal-item').forEach(el => {
    el.classList.remove('dragging', 'drop-target');
  });
}

// ドラッグ中のスタイル
const dragStyle = document.createElement('style');
dragStyle.textContent = `
  .signal-item.dragging    { opacity: 0.4; }
  .signal-item.drop-target { background: #dbeafe !important; border-top: 2px solid #3b82f6; }
`;
document.head.appendChild(dragStyle);

// ── カラーピッカー（ポップオーバー）──
let _colorPickerEl = null;

function openColorPicker(sigId, anchor) {
  closeColorPicker();
  const sig = state.signals.find(s => s.id === sigId);
  if (!sig) return;

  const pop = document.createElement('div');

// ── SVG生成 ──
function buildSVG() {
  const W = canvas.width;
  const H = canvas.height;
  const lines = [];

  lines.push(`<?xml version="1.0" encoding="UTF-8"?>`);
  lines.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`);
  lines.push(`<rect width="${W}" height="${H}" fill="#ffffff"/>`);

  // ── 行背景 ──
  state.signals.forEach((sig, i) => {
    const y = rowToY(i);
    const fill = i % 2 === 0 ? '#fafbff' : '#f5f7fc';
    lines.push(`<rect x="0" y="${y}" width="${W}" height="${ROW_HEIGHT}" fill="${fill}"/>`);
  });
  // ラベル列背景
  lines.push(`<rect x="0" y="0" width="${LABEL_WIDTH}" height="${H}" fill="#f7f8fa"/>`);
  lines.push(`<line x1="${LABEL_WIDTH}" y1="0" x2="${LABEL_WIDTH}" y2="${H}" stroke="#dde" stroke-width="1"/>`);

  // ── 時間軸ヘッダ ──
  lines.push(`<rect x="${LABEL_WIDTH}" y="0" width="${W - LABEL_WIDTH}" height="${HEADER_H}" fill="#eef0f6"/>`);
  lines.push(`<line x1="0" y1="${HEADER_H}" x2="${W}" y2="${HEADER_H}" stroke="#ccd" stroke-width="1"/>`);
  lines.push(svgText(LABEL_WIDTH / 2, HEADER_H / 2, '時間', '#99a', 10, 'middle', 'center'));

  // 目盛り
  const rawStep = 50 / state.scale;
  const tickStep = NICE_STEPS.find(s => s >= rawStep) || 300;
  for (let t = 0; t <= state.totalTime + tickStep; t = Math.round((t + tickStep) * 1000) / 1000) {
    const x = timeToX(t);
    if (x <= LABEL_WIDTH || x >= W) continue;
    lines.push(`<line x1="${x}" y1="${HEADER_H - 5}" x2="${x}" y2="${HEADER_H}" stroke="#bbc" stroke-width="1"/>`);
    const lbl = formatTime(t);
    lines.push(svgText(x, HEADER_H / 2, lbl, '#556', 10, 'middle', 'center'));
  }

  // ── グリッド ──
  if (state.showGrid) {
    for (let t = tickStep; t <= state.totalTime; t = Math.round((t + tickStep) * 1000) / 1000) {
      const x = timeToX(t);
      lines.push(`<line x1="${x}" y1="${HEADER_H}" x2="${x}" y2="${H}" stroke="#e8eaf0" stroke-width="1" stroke-dasharray="3,3"/>`);
    }
    state.signals.forEach((_, i) => {
      const y = rowToY(i + 1);
      lines.push(`<line x1="${LABEL_WIDTH}" y1="${y}" x2="${W}" y2="${y}" stroke="#dde" stroke-width="1"/>`);
    });
  }

  // ── 波形 ──
  state.signals.forEach((sig, rowIdx) => {
    const evs = getSortedEvents(sig.id);
    const n   = sig.levels.length;
    const endT = state.totalTime;
    const segments = [];
    for (let i = 0; i < evs.length; i++) {
      const t0 = evs[i].time, val = evs[i].value;
      const t1 = i + 1 < evs.length ? evs[i + 1].time : endT;
      if (t1 > t0) segments.push({ t0, t1, val });
    }

    if (n === 2) {
      // バイナリ
      let path = '';
      let firstMove = true;
      segments.forEach((seg, si) => {
        const x0 = timeToX(seg.t0), x1 = timeToX(seg.t1);
        const y  = valueToY(rowIdx, seg.val, n);
        if (firstMove) { path += `M${x0},${y}`; firstMove = false; }
        if (si > 0 && segments[si-1].val !== seg.val) path += `L${x0},${y}`;
        path += `L${x1},${y}`;
      });
      lines.push(`<path d="${path}" fill="none" stroke="${sig.color}" stroke-width="2"/>`);

      // 遷移点の縦破線
      segments.forEach((seg, si) => {
        if (si === 0 || segments[si-1].val === seg.val) return;
        const x  = timeToX(seg.t0);
        const y0 = rowToY(rowIdx) + ROW_PAD / 2;
        const y1 = rowToY(rowIdx) + ROW_HEIGHT - ROW_PAD / 2;
        lines.push(`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" stroke="${sig.color}" stroke-width="1" stroke-dasharray="4,3" opacity="0.35"/>`);
      });
    } else {
      // 多値
      segments.forEach((seg, si) => {
        const x0r = timeToX(seg.t0), x1r = timeToX(seg.t1);
        const yT  = rowToY(rowIdx) + ROW_PAD;
        const yB  = rowToY(rowIdx) + ROW_PAD + WAVE_H;
        const yM  = valueToY(rowIdx, seg.val, n);
        const hasL = si > 0, hasR = si < segments.length - 1;
        const x0 = hasL ? x0r + MULTI_SLOPE : x0r;
        const x1 = hasR ? x1r - MULTI_SLOPE : x1r;

        lines.push(`<rect x="${x0}" y="${yT}" width="${x1-x0}" height="${yB-yT}" fill="${sig.color}" opacity="0.08"/>`);
        lines.push(`<line x1="${x0}" y1="${yT}" x2="${x1}" y2="${yT}" stroke="${sig.color}" stroke-width="1.5"/>`);
        lines.push(`<line x1="${x0}" y1="${yB}" x2="${x1}" y2="${yB}" stroke="${sig.color}" stroke-width="1.5"/>`);
        if (hasL) {
          lines.push(`<line x1="${x0r}" y1="${yM}" x2="${x0}" y2="${yT}" stroke="${sig.color}" stroke-width="1.5"/>`);
          lines.push(`<line x1="${x0r}" y1="${yM}" x2="${x0}" y2="${yB}" stroke="${sig.color}" stroke-width="1.5"/>`);
        }
        if (hasR) {
          lines.push(`<line x1="${x1r}" y1="${yM}" x2="${x1}" y2="${yT}" stroke="${sig.color}" stroke-width="1.5"/>`);
          lines.push(`<line x1="${x1r}" y1="${yM}" x2="${x1}" y2="${yB}" stroke="${sig.color}" stroke-width="1.5"/>`);
        }
        const lv = sig.levels[seg.val];
        if (x1 - x0 > 20) lines.push(svgText((x0+x1)/2, (yT+yB)/2, lv, sig.color, 11, 'middle', 'center', 'bold'));
      });
    }

    // 信号名ラベル
    const cy = rowToY(rowIdx) + ROW_HEIGHT / 2;
    lines.push(svgText(8, cy, sig.name, '#1e2a3a', 12, 'middle', 'start', 'bold'));
    sig.levels.forEach((lv, vi) => {
      const ly = valueToY(rowIdx, vi, n);
      lines.push(svgText(LABEL_WIDTH - 6, ly, lv, '#778', 10, 'middle', 'end'));
    });
  });

  // ── アノテーション ──
  if (state.annots.length > 0) {
    const ry = rowToY(state.signals.length);
    lines.push(`<rect x="0" y="${ry}" width="${W}" height="${ANNOT_AREA_H}" fill="#f8f9ff"/>`);
    lines.push(`<line x1="0" y1="${ry}" x2="${W}" y2="${ry}" stroke="#dde" stroke-width="1"/>`);
    lines.push(svgText(8, ry + ANNOT_AREA_H / 2, '注釈', '#aab', 10, 'middle', 'start'));

    state.annots.forEach(a => {
      // 縦破線
      [a.t1, a.t2].forEach(t => {
        const x = timeToX(t);
        lines.push(`<line x1="${x}" y1="${HEADER_H}" x2="${x}" y2="${ry + ANNOT_AREA_H}" stroke="#888" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>`);
      });
      // 矢印
      const x1 = timeToX(a.t1), x2 = timeToX(a.t2);
      const ay = ry + ANNOT_AREA_H / 2;
      const AR = 7;
      lines.push(`<line x1="${x1}" y1="${ay}" x2="${x2}" y2="${ay}" stroke="#2563eb" stroke-width="1.5"/>`);
      lines.push(`<polygon points="${x1},${ay} ${x1+AR},${ay-AR*0.5} ${x1+AR},${ay+AR*0.5}" fill="#2563eb"/>`);
      lines.push(`<polygon points="${x2},${ay} ${x2-AR},${ay-AR*0.5} ${x2-AR},${ay+AR*0.5}" fill="#2563eb"/>`);
      lines.push(`<line x1="${x1}" y1="${ay-8}" x2="${x1}" y2="${ay+8}" stroke="#2563eb" stroke-width="1.5"/>`);
      lines.push(`<line x1="${x2}" y1="${ay-8}" x2="${x2}" y2="${ay+8}" stroke="#2563eb" stroke-width="1.5"/>`);
      if (a.label) {
        const mx = (x1 + x2) / 2;
        lines.push(`<rect x="${mx-20}" y="${ay-8}" width="40" height="16" fill="#f8f9ff" opacity="0.9"/>`);
        lines.push(svgText(mx, ay, a.label, '#2563eb', 12, 'middle', 'center', 'bold'));
      }
    });
  }

  lines.push('</svg>');
  return lines.join('\n');
}

function svgText(x, y, text, fill, size, dominantBaseline, textAnchor, fontWeight='normal') {
  const esc = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<text x="${x}" y="${y}" fill="${fill}" font-size="${size}" font-family="Segoe UI,Meiryo,sans-serif" dominant-baseline="${dominantBaseline}" text-anchor="${textAnchor}" font-weight="${fontWeight}">${esc}</text>`;
}

  document.getElementById('file-input').click();
});

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.signals || !data.events) throw new Error('フォーマットが不正です');
      saveHistory();
      state.signals   = data.signals   || [];
      state.events    = data.events    || [];
      state.annots    = data.annots    || [];
      state.totalTime  = data.totalTime  || 10;
      state.scale      = data.scale      || 80;
      state.showGrid   = data.showGrid   !== undefined ? data.showGrid : true;
      if (data.unitLabel && data.unitFactor) {
        state.unitLabel  = data.unitLabel;
        state.unitFactor = data.unitFactor;
        const opt = unitSelect.querySelector(`option[value="${data.unitLabel}"]`);
        if (opt) opt.selected = true;
      }
      totalTimeInput.value = state.totalTime;
      // idカウンタを最大値より大きくリセット
      const allIds = [...state.signals, ...state.events, ...state.annots].map(o => o.id || 0);
      _nextId = (allIds.length ? Math.max(...allIds) : 0) + 1;
      // colorIdx をリセット
      _colorIdx = state.signals.length;
      document.querySelector('#toolbar input[type=number]').value = state.totalTime;
      refreshAll();
      setStatus(`「${file.name}」を読み込みました（信号数: ${state.signals.length}）`);
    } catch (err) {
      alert('JSONの読み込みに失敗しました: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // 同じファイルを再度選択できるようリセット
});

// ── ズームイン/アウト ──
const SCALE_MIN = 20, SCALE_MAX = 400;

function zoom(factor) {
  const scroll = document.getElementById('canvas-scroll');
  // スクロール中央の時刻を保持
  const centerX = scroll.scrollLeft + scroll.clientWidth / 2;
  const centerT = xToTime(centerX);

  state.scale = Math.min(SCALE_MAX, Math.max(SCALE_MIN, Math.round(state.scale * factor)));
  refreshAll();

  // 同じ時刻が画面中央に来るようスクロール位置を補正
  const newCX = timeToX(centerT);
  scroll.scrollLeft = newCX - scroll.clientWidth / 2;
  setStatus(`ズーム: ${state.scale}px/s`);
}

document.getElementById('btn-zoom-in') .addEventListener('click', () => zoom(1.5));
document.getElementById('btn-zoom-out').addEventListener('click', () => zoom(1 / 1.5));

// マウスホイールでズーム（Ctrl+ホイール）
document.getElementById('canvas-scroll').addEventListener('wheel', e => {

}, { passive: false });

// ── キーボードショートカット ──
document.addEventListener('keydown', e => {
  // モーダル・インライン入力中は無効
  if (document.activeElement.tagName === 'INPUT' ||
      document.activeElement.tagName === 'TEXTAREA') return;
  if (document.querySelector('.modal-overlay.open')) return;

  const key = (e.ctrlKey ? 'Ctrl+' : '') + (e.shiftKey ? 'Shift+' : '') + e.key;

  switch (key) {
    case 'Ctrl+z': case 'Ctrl+Z':
      e.preventDefault(); undo(); break;

    case 'Ctrl++': case 'Ctrl+=':
      e.preventDefault(); zoom(1.5); break;
    case 'Ctrl+-':
      e.preventDefault(); zoom(1 / 1.5); break;
    case 'Ctrl+0':
      e.preventDefault(); state.scale = 80; refreshAll(); break;

    case 'Ctrl+s':
      e.preventDefault();
      document.getElementById('btn-save-json').click(); break;
    case 'Ctrl+Shift+S':
      e.preventDefault();
      document.getElementById('btn-export-png').click(); break;

    case 'g': case 'G':
      state.showGrid = !state.showGrid; updateGridBtn(); refreshAll(); break;

    case '1': setTool('select'); break;
    case '2': setTool('edge');   break;
    case '3': setTool('annot');  break;

    case 'f': case 'F':
      fitToWindow(); refreshAll(); setStatus('全体表示に調整しました'); break;

    case 'Escape':
      setTool('select'); break;
  }
});

document.getElementById('canvas-scroll').addEventListener('mousemove', e => {
  const rect   = canvas.getBoundingClientRect();
  const scroll = document.getElementById('canvas-scroll');
  const x = e.clientX - rect.left + scroll.scrollLeft;

  if (t >= 0 && t <= state.totalTime && x >= LABEL_WIDTH) {
    const tStr = formatTime(t);
    // ステータスバーの右端に時刻を表示
    const base = statusEl.dataset.base || statusEl.textContent;
    statusEl.dataset.base = base.split(' | t=')[0];
    statusEl.textContent  = statusEl.dataset.base + ` | t=${tStr}`;
  }
});

// ── スクロールバーのスタイリング ──
const scrollStyle = document.createElement('style');
scrollStyle.textContent = `
  #canvas-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  #canvas-scroll::-webkit-scrollbar-track { background: #e8eaf0; }
  #canvas-scroll::-webkit-scrollbar-thumb { background: #b0b8cc; border-radius: 4px; }
  #canvas-scroll::-webkit-scrollbar-thumb:hover { background: #8890aa; }
`;
document.head.appendChild(scrollStyle);

// ── 起動完了 ──
loadSampleData();
// 起動後にUIに反映
totalTimeInput.value = state.totalTime;
const _initUnit = unitSelect.querySelector(`option[value="${state.unitLabel}"]`);
if (_initUnit) _initUnit.selected = true;
showHelp();
refreshAll();
</script>

</body>
</html>
